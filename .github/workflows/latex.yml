name: Build and Release LaTeX Report

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Times New Roman font
        run: |
          echo "=== Installing Times New Roman font ==="
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y fontconfig wget unzip cabextract || true
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache fontconfig wget unzip cabextract || true
          fi

          mkdir -p /tmp/fonts ~/.local/share/fonts ~/.fonts

          echo "Downloading Times New Roman TTF fonts..."
          BASE="https://github.com/google/fonts/raw/main/ofl/timesnewroman"
          for f in Regular Bold Italic BoldItalic; do
            wget -q --timeout=15 -O "/tmp/fonts/TimesNewRoman-$f.ttf" "$BASE/TimesNewRoman-$f.ttf" \
              || echo "Failed to download $f"
          done

          cp /tmp/fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
          cp /tmp/fonts/*.ttf ~/.fonts/ 2>/dev/null || true
          if [ -w /usr/share/fonts ] 2>/dev/null; then
            mkdir -p /usr/share/fonts/truetype/msttcorefonts/
            cp /tmp/fonts/*.ttf /usr/share/fonts/truetype/msttcorefonts/ 2>/dev/null || true
          fi

          if command -v fc-cache >/dev/null 2>&1; then
            fc-cache -f ~/.fonts ~/.local/share/fonts 2>/dev/null || true
            fc-cache -f 2>/dev/null || true
          fi
          fc-list | grep -i "Times New Roman" || echo "Times New Roman not found (sẽ dùng fallback)"

      - name: Compile LaTeX (XeLaTeX)
        run: |
          export OSFONTDIR="$HOME/.fonts:$HOME/.local/share/fonts:/usr/share/fonts"

          # Nếu không có Times New Roman -> thay bằng TeX Gyre Termes (tương đương, có sẵn trong TeX Live)
          TIMES_AVAILABLE=$(fc-list | grep -i "Times New Roman" | wc -l || echo "0")
          if [ "$TIMES_AVAILABLE" -eq "0" ]; then
            echo "=== Dùng fallback TeX Gyre Termes ==="
            cp report.tex report.tex.backup
            sed -i 's/Times New Roman/TeX Gyre Termes/g' report.tex
          fi

          set +e
          for pass in 1 2 3; do
            echo "=== XeLaTeX pass $pass ==="
            xelatex -interaction=nonstopmode report.tex 2>&1 | tee compile$pass.log
          done
          set -e

          [ -f report.tex.backup ] && mv report.tex.backup report.tex || true

          if [ -f report.pdf ]; then
            echo "PDF tạo thành công:"; ls -lh report.pdf
          else
            echo "Lỗi: không tạo được PDF"; tail -80 report.log || true; exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: report.pdf

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-pdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: report-pdf
          path: dist
      - name: Prepare release file
        run: cp dist/report.pdf "Bao_cao_He_thong_goi_y_Amazon_Software.pdf"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Báo cáo Big Data ${{ github.run_number }}
          generate_release_notes: true
          files: Bao_cao_He_thong_goi_y_Amazon_Software.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
